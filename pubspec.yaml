name: pdf_pipeline_app
description: "PDF 업로드·변환·파일 관리 지원 앱"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  logger: ^2.7.0
  pretty_dio_logger: ^1.4.0
  skeletonizer: ^2.1.3
  fluttertoast: ^9.0.0
  catching_josh: ^1.2.4
  flutter_spinkit: ^5.2.2
  dart_balancer: ^0.3.0
  fpdart: ^1.2.0
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  flutter_dotenv: ^6.0.0
  go_router: ^17.2.1
  equatable: ^2.0.8
  flutter_riverpod: ^3.3.1
  flutter_native_splash: ^2.4.7
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  doc_scan_flutter: ^1.0.6
  file_picker: ^10.1.9
  image_picker: ^1.2.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  pdf: ^3.11.1
  pdfrx: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  android_12:
    color: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
